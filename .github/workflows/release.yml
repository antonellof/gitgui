name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        run: |
          cargo build --release --target ${{ matrix.target }}
          ver="${GITHUB_REF_NAME#v}"
          out="gitgui-${ver}-${{ matrix.name }}"
          cp "target/${{ matrix.target }}/release/gitgui" "$out"
          tar czf "${out}.tar.gz" "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: gitgui-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

  # After the assets exist, regenerate the Homebrew formula on main from their
  # sha256 digests, so `brew upgrade` picks the release up.
  formula:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: bump the formula
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The digests appear a moment after the upload, so retry a few times.
          for attempt in 1 2 3 4 5; do
            python3 scripts/formula.py "$version" && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 15
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/gitgui.rb
          if git diff --cached --quiet; then
            echo "formula already up to date"
            exit 0
          fi
          git commit -m "brew: gitgui $version [skip ci]"
          git push origin main
