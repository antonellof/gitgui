name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        run: |
          cargo build --release --target ${{ matrix.target }}
          ver="${GITHUB_REF_NAME#v}"
          out="gitgui-${ver}-${{ matrix.name }}"
          cp "target/${{ matrix.target }}/release/gitgui" "$out"
          tar czf "${out}.tar.gz" "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: gitgui-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
